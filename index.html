<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iammr9 ✦ Stellar</title>
<meta name="description" content="iammr9 · huss huss huss · Stellar Launcher">
<meta name="theme-color" content="#050507">
<meta property="og:title" content="iammr9 ✦ Stellar">
<meta property="og:description" content="huss huss huss · Stellar Launcher, TikTok, YouTube, Roblox and more">
<meta property="og:image" content="https://iammr9.github.io/avatar.jpg">
<meta property="og:url" content="https://iammr9.github.io/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.png">
<link rel="preload" href="fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star4" viewBox="0 0 24 24"><path d="M12 1.2 C12.6 7.6 16.4 11.4 22.8 12 C16.4 12.6 12.6 16.4 12 22.8 C11.4 16.4 7.6 12.6 1.2 12 C7.6 11.4 11.4 7.6 12 1.2 Z"/></symbol>
</svg>

<!-- the sky: an ASCII universe drawn on one canvas -->
<canvas id="space" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<canvas id="hands" aria-hidden="true"></canvas>

<!-- first visit: click to enter (browsers only allow sound after a click) -->
<button class="gate" id="gate" type="button" aria-label="Enter">
  <span class="gate-line"><span id="gateType"></span><i class="caret"></i></span>
  <span class="gate-hint">click anywhere to enter</span>
</button>

<main class="stage" id="stage" aria-live="polite">
  <article class="card" id="card">
    <div class="glare" aria-hidden="true"></div>
    <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
    <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>

    <header class="bar">
      <span class="tag"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star4"/></svg>STELLAR</span>
      <button class="sound" id="sound" type="button" aria-label="Turn music off" aria-pressed="true">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="sound-label" id="soundLabel">sound on</span>
      </button>
    </header>

    <section class="who">
      <div class="avatar">
        <svg class="orbit" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="57"/></svg>
        <img id="avatar" alt="">
        <svg class="sat" viewBox="0 0 24 24" aria-hidden="true"><use href="#star4"/></svg>
      </div>
      <h1 class="name"><span id="name"></span><i class="caret" id="nameCaret"></i></h1>
      <p class="handle" id="handle"></p>
      <p class="role"><span class="prompt">&gt;</span> <span id="role"></span><i class="caret small"></i></p>
      <p class="bio" id="bio"></p>
    </section>

    <nav class="links" id="links" aria-label="Links"></nav>
    <div class="buttons" id="buttons"></div>

    <footer class="foot">
      <span id="clock">--:--</span>
      <span class="dot">·</span>
      <span>made with <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star4"/></svg></span>
    </footer>
  </article>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
